[pytest]
asyncio_mode = auto
; The async SQLAlchemy engine (app.core.db.engine) is created once at import
; time and its pooled asyncpg connections are bound to whatever event loop
; existed then. pytest-asyncio's default per-test loop would tear that loop
; down after test 1, corrupting the pool for every test after it
; ("cannot perform operation: another operation is in progress") — so tests
; share one loop for the whole session instead.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
